    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;

    position: relative;
    display: block;
    width: 100%;
    margin: 0;
    padding: clamp(72px, 9vw, 120px) clamp(20px, 4vw, 48px) clamp(64px, 8vw, 104px);
    background-color: var(--cbb-black);
    background-image:
      linear-gradient(90deg, rgba(10, 11, 12, 0.9) 0%, rgba(10, 11, 12, 0.7) 40%, rgba(10, 11, 12, 0.25) 75%, rgba(10, 11, 12, 0.15) 100%),
      linear-gradient(0deg, rgba(10, 11, 12, 0.85) 0%, rgba(10, 11, 12, 0) 40%),
      var(--cbb-pagehero-photo),
      linear-gradient(180deg, #1E170F 0%, #0F0E0C 100%);
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    border-bottom: 1px solid rgba(213, 167, 86, 0.3);
    color: var(--cbb-cream);
    font-family: var(--cbb-sans);
    overflow: hidden;
  }
  .cbb-pagehero,
  .cbb-pagehero *,
  .cbb-pagehero *::before,
  .cbb-pagehero *::after {
    box-sizing: border-box;
  }

  .cbb-pagehero .cbb-pagehero__inner {
    max-width: 1320px;
    margin: 0 auto;
  }
  .cbb-pagehero .cbb-pagehero__content {
    max-width: 680px;
  }

  /* ---- Breadcrumb ---- */
  .cbb-pagehero .cbb-pagehero__crumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 0 0 clamp(20px, 2.4vw, 28px);
    padding: 0;
    list-style: none;
    font-family: var(--cbb-sans);
    font-size: 0.8125rem;
    line-height: 1.4;
    color: rgba(246, 239, 227, 0.7);
  }
  .cbb-pagehero .cbb-pagehero__crumb {
    margin: 0;
    padding: 0;
  }
  .cbb-pagehero .cbb-pagehero__crumb::marker {
    content: none;
  }
  .cbb-pagehero .cbb-pagehero__crumb + .cbb-pagehero__crumb::before {
    content: "/";
    margin-right: 10px;
    color: rgba(213, 167, 86, 0.7);
  }
  .cbb-pagehero .cbb-pagehero__crumb-link {
    color: rgba(246, 239, 227, 0.7);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-pagehero .cbb-pagehero__crumb-link:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-pagehero .cbb-pagehero__crumb-link:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }
  .cbb-pagehero .cbb-pagehero__crumb[aria-current] {
    color: var(--cbb-gold);
  }

  /* ---- Text ---- */
  .cbb-pagehero .cbb-pagehero__eyebrow {
    margin: 0 0 16px;
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: clamp(0.6875rem, 0.3vw + 0.6rem, 0.8125rem);
    font-weight: 500;
    line-height: 1.6;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cbb-gold);
  }
  .cbb-pagehero .cbb-pagehero__title {
    margin: 0 0 clamp(18px, 2vw, 24px);
    padding: 0;
    font-family: var(--cbb-serif);
    font-size: clamp(2.25rem, 3.4vw + 0.9rem, 4rem);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--cbb-cream);
  }
  .cbb-pagehero .cbb-pagehero__gold {
    color: var(--cbb-gold);
    background: linear-gradient(180deg, var(--cbb-gold-light) 0%, var(--cbb-gold) 55%, var(--cbb-gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cbb-pagehero .cbb-pagehero__sub {
    max-width: 34em;
    margin: 0 0 clamp(28px, 3vw, 36px);
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: clamp(1rem, 0.35vw + 0.92rem, 1.125rem);
    font-weight: 400;
    line-height: 1.65;
    color: var(--cbb-cream);
  }

  /* ---- Buttons (same style as the home hero) ---- */
  .cbb-pagehero .cbb-pagehero__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .cbb-pagehero .cbb-pagehero__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 52px;
    padding: 0 26px;
    border: 1px solid transparent;
    border-radius: 3px;
    font-family: var(--cbb-sans);
    font-size: 0.975rem;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: none;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  }
  .cbb-pagehero .cbb-pagehero__btn svg {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    transition: transform 0.2s ease;
  }
  .cbb-pagehero .cbb-pagehero__btn:hover svg {
    transform: translateX(3px);
  }
  .cbb-pagehero .cbb-pagehero__btn--gold {
    background: linear-gradient(135deg, var(--cbb-gold-deep), var(--cbb-gold-light));
    color: var(--cbb-black);
  }
  .cbb-pagehero .cbb-pagehero__btn--gold:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(213, 167, 86, 0.3);
    color: var(--cbb-black);
  }
  .cbb-pagehero .cbb-pagehero__btn--outline {
    background: rgba(10, 11, 12, 0.35);
    border-color: var(--cbb-gold);
    color: var(--cbb-gold-light);
  }
  .cbb-pagehero .cbb-pagehero__btn--outline:hover {
    background: rgba(213, 167, 86, 0.1);
    color: var(--cbb-gold-light);
  }
  .cbb-pagehero .cbb-pagehero__btn:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }

  @media (max-width: 860px) {
    .cbb-pagehero {
      background-image:
        linear-gradient(180deg, rgba(10, 11, 12, 0.72) 0%, rgba(10, 11, 12, 0.8) 60%, rgba(10, 11, 12, 0.92) 100%),
        var(--cbb-pagehero-photo),
        linear-gradient(180deg, #1E170F 0%, #0F0E0C 100%);
      background-position: 70% center;
    }
  }
  @media (max-width: 480px) {
    .cbb-pagehero .cbb-pagehero__actions {
      flex-direction: column;
    }
    .cbb-pagehero .cbb-pagehero__btn {
      width: 100%;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cbb-pagehero .cbb-pagehero__btn,
    .cbb-pagehero .cbb-pagehero__btn svg,
    .cbb-pagehero .cbb-pagehero__crumb-link {
      transition: none;
    }
  }
</style>
