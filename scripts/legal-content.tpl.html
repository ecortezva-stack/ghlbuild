<style>
  .cbb-legal {
    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    /* keeps headings clear of the pinned header when jumping to them */
    --cbb-legal-offset: 112px;

    position: relative;
    display: block;
    width: 100%;
    margin: 0;
    padding: clamp(48px, 6vw, 88px) clamp(20px, 4vw, 48px) clamp(64px, 7vw, 104px);
    background: var(--cbb-black);
    color: var(--cbb-cream);
    font-family: var(--cbb-sans);
  }
  .cbb-legal,
  .cbb-legal *,
  .cbb-legal *::before,
  .cbb-legal *::after {
    box-sizing: border-box;
  }

  .cbb-legal .cbb-legal__inner {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    align-items: start;
    gap: clamp(40px, 5vw, 72px);
    max-width: 1320px;
    margin: 0 auto;
  }

  /* ---- Table of contents (desktop: stays in view while reading) ---- */
  .cbb-legal .cbb-legal__aside {
    position: sticky;
    top: var(--cbb-legal-offset);
    max-height: calc(100vh - var(--cbb-legal-offset) - 24px);
    overflow-y: auto;
    padding: 24px;
    border: 1px solid rgba(213, 167, 86, 0.3);
    border-radius: 4px;
    background: #0D0E0F;
  }
  .cbb-legal .cbb-legal__toc-label {
    margin: 0 0 14px;
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--cbb-gold);
  }
  .cbb-legal .cbb-legal__toc-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cbb-legal .cbb-legal__toc-item {
    margin: 0;
    padding: 0;
  }
  .cbb-legal .cbb-legal__toc-item::marker {
    content: none;
  }
  .cbb-legal .cbb-legal__toc-link {
    display: block;
    padding: 7px 0 7px 12px;
    border-left: 1px solid rgba(213, 167, 86, 0.18);
    font-family: var(--cbb-sans);
    font-size: 0.875rem;
    line-height: 1.4;
    color: rgba(246, 239, 227, 0.78);
    text-decoration: none;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .cbb-legal .cbb-legal__toc-link:hover {
    border-left-color: var(--cbb-gold);
    color: var(--cbb-gold-light);
  }
  .cbb-legal .cbb-legal__toc-link:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 2px;
  }
  .cbb-legal .cbb-legal__toc-num {
    color: var(--cbb-gold);
  }

  /* Mobile table of contents (a tap-to-open list) */
  .cbb-legal .cbb-legal__toc-mobile {
    display: none;
    margin: 0 0 32px;
    border: 1px solid rgba(213, 167, 86, 0.35);
    border-radius: 4px;
    background: #0D0E0F;
  }
  .cbb-legal .cbb-legal__toc-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    font-family: var(--cbb-sans);
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cbb-gold);
    cursor: pointer;
    list-style: none;
  }
  .cbb-legal .cbb-legal__toc-summary::-webkit-details-marker {
    display: none;
  }
  .cbb-legal .cbb-legal__toc-summary::after {
    content: "";
    width: 8px;
    height: 8px;
    border-right: 1.5px solid var(--cbb-gold);
    border-bottom: 1.5px solid var(--cbb-gold);
    transform: translateY(-2px) rotate(45deg);
    transition: transform 0.2s ease;
  }
  .cbb-legal .cbb-legal__toc-mobile[open] .cbb-legal__toc-summary::after {
    transform: translateY(2px) rotate(-135deg);
  }
  .cbb-legal .cbb-legal__toc-summary:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 2px;
  }
  .cbb-legal .cbb-legal__toc-mobile .cbb-legal__toc-list {
    padding: 0 18px 16px;
  }

  /* ---- Body text ---- */
  .cbb-legal .cbb-legal__body {
    max-width: 780px;
    min-width: 0;
  }
  .cbb-legal .cbb-legal__intro {
    margin: 0 0 clamp(32px, 4vw, 48px);
    padding: 0 0 clamp(28px, 3vw, 40px);
    border-bottom: 1px solid rgba(213, 167, 86, 0.25);
  }
  .cbb-legal .cbb-legal__intro .cbb-legal__p {
    font-size: clamp(1.0625rem, 0.3vw + 0.98rem, 1.1875rem);
    line-height: 1.7;
    color: var(--cbb-cream);
  }

  .cbb-legal .cbb-legal__section {
    margin: 0;
    padding: clamp(28px, 3vw, 36px) 0 0;
    scroll-margin-top: var(--cbb-legal-offset);
  }
  .cbb-legal .cbb-legal__section + .cbb-legal__section {
    margin-top: clamp(28px, 3vw, 36px);
    border-top: 1px solid rgba(213, 167, 86, 0.14);
  }
  .cbb-legal .cbb-legal__h2 {
    margin: 0 0 18px;
    padding: 0;
    font-family: var(--cbb-serif);
    font-size: clamp(1.5rem, 1vw + 1.1rem, 1.875rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: 0;
    text-transform: none;
    color: var(--cbb-cream);
  }
  .cbb-legal .cbb-legal__num {
    color: var(--cbb-gold);
  }
  .cbb-legal .cbb-legal__p {
    margin: 0 0 16px;
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.75;
    color: rgba(246, 239, 227, 0.86);
  }
  .cbb-legal .cbb-legal__p:last-child {
    margin-bottom: 0;
  }
  /* ALL-CAPS paragraphs (disclaimers): slightly smaller so they stay readable */
  .cbb-legal .cbb-legal__p--caps {
    font-size: 0.9375rem;
    letter-spacing: 0.01em;
    color: var(--cbb-cream);
  }
  .cbb-legal .cbb-legal__ul {
    margin: 0 0 18px;
    padding: 0;
    list-style: none;
  }
  .cbb-legal .cbb-legal__li {
    position: relative;
    margin: 0;
    padding: 5px 0 5px 24px;
    font-family: var(--cbb-sans);
    font-size: 1rem;
    line-height: 1.65;
    color: rgba(246, 239, 227, 0.86);
  }
  .cbb-legal .cbb-legal__li::marker {
    content: none;
  }
  .cbb-legal .cbb-legal__li::before {
    content: "";
    position: absolute;
    top: 0.95em;
    left: 4px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cbb-gold);
  }
  .cbb-legal .cbb-legal__inline-link {
    color: var(--cbb-gold);
    text-decoration: underline;
    text-decoration-color: rgba(213, 167, 86, 0.5);
    text-underline-offset: 3px;
    transition: color 0.2s ease;
  }
  .cbb-legal .cbb-legal__inline-link:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-legal .cbb-legal__inline-link:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 2px;
  }

  .cbb-legal .cbb-legal__top {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: clamp(40px, 5vw, 56px);
    font-family: var(--cbb-sans);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--cbb-gold);
    text-decoration: none;
  }
  .cbb-legal .cbb-legal__top svg {
    width: 16px;
    height: 16px;
  }
  .cbb-legal .cbb-legal__top:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-legal .cbb-legal__top:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }

  @media (max-width: 960px) {
    .cbb-legal .cbb-legal__inner {
      grid-template-columns: minmax(0, 1fr);
    }
    .cbb-legal .cbb-legal__aside {
      display: none;
    }
    .cbb-legal .cbb-legal__toc-mobile {
      display: block;
    }
    .cbb-legal .cbb-legal__body {
      max-width: none;
    }
  }
  @media (max-width: 860px) {
    .cbb-legal {
      --cbb-legal-offset: 92px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cbb-legal .cbb-legal__toc-link,
    .cbb-legal .cbb-legal__inline-link,
    .cbb-legal .cbb-legal__toc-summary::after {
      transition: none;
    }
  }
</style>
