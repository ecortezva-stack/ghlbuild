<!-- ============================================================
     CBB — HEADER / NAVIGATION (HOME PAGE ONLY)
     Use this on the Home page in place of sections/00-header.html.
     Every other page keeps sections/00-header.html.
     Paste into a GoHighLevel Custom HTML/JavaScript element.
     All styles are scoped to .cbb-hh; the script only touches
     elements inside .cbb-hh.

     Links: Home, COVERED BRIDGE BRAND CAPITAL (/funding),
     Data List (/data-list), Services, About, Contact. With six links
     the menu switches to the mobile (hamburger) menu at 1024px and
     below, so the long label never squeezes the logo.

     Stays pinned to the top while scrolling. It uses position: fixed
     (not sticky) because GHL wraps each element in its own container,
     which would stop a sticky header from staying up. The outer
     .cbb-hh box reserves the header's height so page content
     starts below it.
     ============================================================ -->
<style>
  .cbb-hh {
    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    --cbb-hh-h: 88px;

    /* This outer box is the spacer: same height as the fixed bar */
    position: relative;
    display: block;
    width: 100%;
    height: calc(var(--cbb-hh-h) + 1px); /* + the bar's 1px gold border */
    margin: 0;
    padding: 0;
    background: var(--cbb-black);
    font-family: var(--cbb-sans);
  }
  .cbb-hh,
  .cbb-hh *,
  .cbb-hh *::before,
  .cbb-hh *::after {
    box-sizing: border-box;
  }

  .cbb-hh .cbb-hh__bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    width: 100%;
    margin: 0;
    padding: 0 clamp(16px, 4vw, 48px);
    background: rgba(10, 11, 12, 0.97);
    border-bottom: 1px solid rgba(213, 167, 86, 0.45);
    transition: box-shadow 0.25s ease, background-color 0.25s ease;
  }
  .cbb-hh.is-scrolled .cbb-hh__bar {
    background: rgba(10, 11, 12, 0.94);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .cbb-hh.is-scrolled .cbb-hh__bar {
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
  }

  .cbb-hh .cbb-hh__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    max-width: 1320px;
    height: var(--cbb-hh-h);
    margin: 0 auto;
  }

  /* ---- Logo ---- */
  .cbb-hh .cbb-hh__brand {
    display: flex;
    align-items: center;
    flex: 0 1 auto;
    min-width: 0;
    text-decoration: none;
  }
  .cbb-hh .cbb-hh__logo {
    display: block;
    width: auto;
    max-width: 100%;
    height: clamp(46px, 4.8vw, 66px);
    border: 0;
  }
  .cbb-hh .cbb-hh__brand:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 4px;
  }

  /* ---- Desktop nav ---- */
  .cbb-hh .cbb-hh__nav {
    display: block;
  }
  .cbb-hh .cbb-hh__list {
    display: flex;
    align-items: center;
    gap: clamp(24px, 3.4vw, 48px);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cbb-hh .cbb-hh__item {
    margin: 0;
    padding: 0;
  }
  .cbb-hh .cbb-hh__item::marker {
    content: none;
  }
  .cbb-hh .cbb-hh__link {
    position: relative;
    display: inline-block;
    padding: 8px 0;
    font-family: var(--cbb-sans);
    font-size: 0.9375rem;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-hh .cbb-hh__link::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    height: 2px;
    background: linear-gradient(90deg, var(--cbb-gold-deep), var(--cbb-gold-light));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.25s ease;
  }
  /* Hover / keyboard focus: gold text + gold underline sliding in from
     the left. Same for every link, including the current page. */
  .cbb-hh .cbb-hh__link:hover,
  .cbb-hh .cbb-hh__link:focus-visible {
    color: var(--cbb-gold);
  }
  .cbb-hh .cbb-hh__link:hover::after,
  .cbb-hh .cbb-hh__link:focus-visible::after {
    transform: scaleX(1);
  }
  .cbb-hh .cbb-hh__link:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 4px;
  }

  /* ---- Hamburger (mobile only) ---- */
  .cbb-hh .cbb-hh__toggle {
    display: none;
    flex: 0 0 auto;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: 6px;
    width: 46px;
    height: 46px;
    margin: 0;
    padding: 0 11px;
    border: 1px solid rgba(213, 167, 86, 0.55);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .cbb-hh .cbb-hh__toggle:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }
  .cbb-hh .cbb-hh__bar-line {
    display: block;
    width: 100%;
    height: 1.5px;
    background: var(--cbb-gold);
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .cbb-hh.is-open .cbb-hh__bar-line:nth-child(1) {
    transform: translateY(7.5px) rotate(45deg);
  }
  .cbb-hh.is-open .cbb-hh__bar-line:nth-child(2) {
    opacity: 0;
  }
  .cbb-hh.is-open .cbb-hh__bar-line:nth-child(3) {
    transform: translateY(-7.5px) rotate(-45deg);
  }
  .cbb-hh .cbb-hh__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---- Six links: tighter spacing so everything fits on one line ---- */
  .cbb-hh .cbb-hh__list {
    gap: clamp(20px, 2.1vw, 40px);
  }
  .cbb-hh .cbb-hh__link {
    white-space: nowrap;
  }
  @media (max-width: 1240px) {
    .cbb-hh .cbb-hh__logo {
      height: clamp(46px, 4.4vw, 54px);
    }
    .cbb-hh .cbb-hh__link {
      font-size: 0.875rem;
    }
  }

  /* ---- Mobile: slide-down menu ---- */
  @media (max-width: 1024px) {
    .cbb-hh {
      --cbb-hh-h: 72px;
    }
    .cbb-hh .cbb-hh__toggle {
      display: flex;
    }
    .cbb-hh .cbb-hh__nav {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 0;
      overflow: hidden;
      visibility: hidden;
      background: var(--cbb-black);
      border-bottom: 1px solid rgba(213, 167, 86, 0);
      transition: max-height 0.35s ease, visibility 0s linear 0.35s, border-color 0.35s ease;
    }
    .cbb-hh.is-open .cbb-hh__nav {
      max-height: calc(100vh - var(--cbb-hh-h));
      overflow-y: auto;
      visibility: visible;
      border-bottom-color: rgba(213, 167, 86, 0.45);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.6);
      transition: max-height 0.35s ease, visibility 0s linear 0s, border-color 0.35s ease;
    }
    .cbb-hh .cbb-hh__list {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 8px clamp(16px, 4vw, 48px) 24px;
    }
    .cbb-hh .cbb-hh__link {
      display: block;
      padding: 16px 0;
      border-bottom: 1px solid rgba(213, 167, 86, 0.15);
      font-size: 1.0625rem;
    }
    /* On mobile the hover underline is a short gold bar under the label */
    .cbb-hh .cbb-hh__link::after {
      right: auto;
      bottom: 10px;
      width: 28px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cbb-hh .cbb-hh__bar,
    .cbb-hh .cbb-hh__link,
    .cbb-hh .cbb-hh__link::after,
    .cbb-hh .cbb-hh__bar-line,
    .cbb-hh .cbb-hh__nav {
      transition: none;
    }
  }
</style>

<div class="cbb-hh">
  <header class="cbb-hh__bar">
    <div class="cbb-hh__inner">
      <a class="cbb-hh__brand" href="/" aria-label="Covered Bridge Brands home">
        <!-- LOGO: served from the GHL media library (Covered Bridge Brands logo). -->
        <img class="cbb-hh__logo" src="https://assets.cdn.filesafe.space/1LlHASBki3wgNdbhAlBp/media/6abd1ce51b644080e36e3b11.webp" alt="Covered Bridge Brands" width="576" height="120" decoding="async">
      </a>

      <button class="cbb-hh__toggle" type="button" aria-expanded="false" aria-controls="cbb-hh-nav">
        <span class="cbb-hh__bar-line" aria-hidden="true"></span>
        <span class="cbb-hh__bar-line" aria-hidden="true"></span>
        <span class="cbb-hh__bar-line" aria-hidden="true"></span>
        <span class="cbb-hh__sr">Open menu</span>
      </button>

      <nav class="cbb-hh__nav" id="cbb-hh-nav" aria-label="Main">
        <!-- Links only turn gold and underline on hover. The current page is
             tagged for screen readers (aria-current) from the URL, with no
             visual change. -->
        <ul class="cbb-hh__list">
          <li class="cbb-hh__item"><a class="cbb-hh__link" href="/">Home</a></li>
          <li class="cbb-hh__item"><a class="cbb-hh__link" href="/funding">COVERED BRIDGE BRAND CAPITAL</a></li>
          <li class="cbb-hh__item"><a class="cbb-hh__link" href="/data-list">Data List</a></li>
          <li class="cbb-hh__item"><a class="cbb-hh__link" href="/services">Services</a></li>
          <li class="cbb-hh__item"><a class="cbb-hh__link" href="/about">About</a></li>
          <li class="cbb-hh__item"><a class="cbb-hh__link" href="/contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
</div>

<script>
  (function () {
    var roots = document.querySelectorAll('.cbb-hh:not([data-cbb-ready])');
    Array.prototype.forEach.call(roots, function (root) {
      root.setAttribute('data-cbb-ready', '');
      var toggle = root.querySelector('.cbb-hh__toggle');
      var label = root.querySelector('.cbb-hh__sr');
      var links = root.querySelectorAll('.cbb-hh__link');
      var desktop = window.matchMedia('(min-width: 1025px)');

      /* Current page: tag the matching link for screen readers */
      var clean = function (p) { return (p || '/').replace(/\/+$/, '') || '/'; };
      var here = clean(window.location.pathname);
      var match = null;
      Array.prototype.forEach.call(links, function (a) {
        var path = clean(a.getAttribute('href'));
        if (path === here || (path !== '/' && here.indexOf(path + '/') === 0)) match = a;
      });
      if (match) match.setAttribute('aria-current', 'page');

      /* Mobile menu */
      var setOpen = function (open) {
        root.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        label.textContent = open ? 'Close menu' : 'Open menu';
      };
      toggle.addEventListener('click', function () {
        setOpen(!root.classList.contains('is-open'));
      });
      Array.prototype.forEach.call(links, function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && root.classList.contains('is-open')) {
          setOpen(false);
          toggle.focus();
        }
      });
      document.addEventListener('click', function (e) {
        if (root.classList.contains('is-open') && !root.contains(e.target)) setOpen(false);
      });
      var onBreakpoint = function () { if (desktop.matches) setOpen(false); };
      if (desktop.addEventListener) desktop.addEventListener('change', onBreakpoint);
      else if (desktop.addListener) desktop.addListener(onBreakpoint);

      /* Shadow once the page scrolls */
      var onScroll = function () { root.classList.toggle('is-scrolled', window.scrollY > 8); };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    });
  })();
</script>
