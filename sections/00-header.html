<!-- ============================================================
     CBB — HEADER / NAVIGATION
     Paste into a GoHighLevel Custom HTML/JavaScript element.
     All styles are scoped to .cbb-header; the script only touches
     elements inside .cbb-header.

     Stays pinned to the top while scrolling. It uses position: fixed
     (not sticky) because GHL wraps each element in its own container,
     which would stop a sticky header from staying up. The outer
     .cbb-header box reserves the header's height so page content
     starts below it.
     ============================================================ -->
<style>
  .cbb-header {
    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
    --cbb-header-h: 88px;

    /* This outer box is the spacer: same height as the fixed bar */
    position: relative;
    display: block;
    width: 100%;
    height: calc(var(--cbb-header-h) + 1px); /* + the bar's 1px gold border */
    margin: 0;
    padding: 0;
    background: var(--cbb-black);
    font-family: var(--cbb-sans);
  }
  .cbb-header,
  .cbb-header *,
  .cbb-header *::before,
  .cbb-header *::after {
    box-sizing: border-box;
  }

  .cbb-header .cbb-header__bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    width: 100%;
    margin: 0;
    padding: 0 clamp(16px, 4vw, 48px);
    background: rgba(10, 11, 12, 0.97);
    border-bottom: 1px solid rgba(213, 167, 86, 0.45);
    transition: box-shadow 0.25s ease, background-color 0.25s ease;
  }
  .cbb-header.is-scrolled .cbb-header__bar {
    background: rgba(10, 11, 12, 0.94);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .cbb-header.is-scrolled .cbb-header__bar {
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
  }

  .cbb-header .cbb-header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    max-width: 1320px;
    height: var(--cbb-header-h);
    margin: 0 auto;
  }

  /* ---- Logo ---- */
  .cbb-header .cbb-header__brand {
    display: flex;
    align-items: center;
    flex: 0 1 auto;
    min-width: 0;
    text-decoration: none;
  }
  .cbb-header .cbb-header__logo {
    display: block;
    width: auto;
    max-width: 100%;
    height: clamp(46px, 4.8vw, 66px);
    border: 0;
  }
  .cbb-header .cbb-header__brand:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 4px;
  }

  /* ---- Desktop nav ---- */
  .cbb-header .cbb-header__nav {
    display: block;
  }
  .cbb-header .cbb-header__list {
    display: flex;
    align-items: center;
    gap: clamp(24px, 3.4vw, 48px);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cbb-header .cbb-header__item {
    margin: 0;
    padding: 0;
  }
  .cbb-header .cbb-header__item::marker {
    content: none;
  }
  .cbb-header .cbb-header__link {
    position: relative;
    display: inline-block;
    padding: 8px 0;
    font-family: var(--cbb-sans);
    font-size: 0.9375rem;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-header .cbb-header__link::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    height: 2px;
    background: linear-gradient(90deg, var(--cbb-gold-deep), var(--cbb-gold-light));
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.25s ease;
  }
  /* Hover / keyboard focus: gold text + gold underline sliding in from
     the left. Same for every link, including the current page. */
  .cbb-header .cbb-header__link:hover,
  .cbb-header .cbb-header__link:focus-visible {
    color: var(--cbb-gold);
  }
  .cbb-header .cbb-header__link:hover::after,
  .cbb-header .cbb-header__link:focus-visible::after {
    transform: scaleX(1);
  }
  .cbb-header .cbb-header__link:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 4px;
  }

  /* ---- Hamburger (mobile only) ---- */
  .cbb-header .cbb-header__toggle {
    display: none;
    flex: 0 0 auto;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: 6px;
    width: 46px;
    height: 46px;
    margin: 0;
    padding: 0 11px;
    border: 1px solid rgba(213, 167, 86, 0.55);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .cbb-header .cbb-header__toggle:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }
  .cbb-header .cbb-header__bar-line {
    display: block;
    width: 100%;
    height: 1.5px;
    background: var(--cbb-gold);
    transition: transform 0.25s ease, opacity 0.2s ease;
  }
  .cbb-header.is-open .cbb-header__bar-line:nth-child(1) {
    transform: translateY(7.5px) rotate(45deg);
  }
  .cbb-header.is-open .cbb-header__bar-line:nth-child(2) {
    opacity: 0;
  }
  .cbb-header.is-open .cbb-header__bar-line:nth-child(3) {
    transform: translateY(-7.5px) rotate(-45deg);
  }
  .cbb-header .cbb-header__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---- Mobile: slide-down menu ---- */
  @media (max-width: 860px) {
    .cbb-header {
      --cbb-header-h: 72px;
    }
    .cbb-header .cbb-header__toggle {
      display: flex;
    }
    .cbb-header .cbb-header__nav {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      max-height: 0;
      overflow: hidden;
      visibility: hidden;
      background: var(--cbb-black);
      border-bottom: 1px solid rgba(213, 167, 86, 0);
      transition: max-height 0.35s ease, visibility 0s linear 0.35s, border-color 0.35s ease;
    }
    .cbb-header.is-open .cbb-header__nav {
      max-height: calc(100vh - var(--cbb-header-h));
      overflow-y: auto;
      visibility: visible;
      border-bottom-color: rgba(213, 167, 86, 0.45);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.6);
      transition: max-height 0.35s ease, visibility 0s linear 0s, border-color 0.35s ease;
    }
    .cbb-header .cbb-header__list {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 8px clamp(16px, 4vw, 48px) 24px;
    }
    .cbb-header .cbb-header__link {
      display: block;
      padding: 16px 0;
      border-bottom: 1px solid rgba(213, 167, 86, 0.15);
      font-size: 1.0625rem;
    }
    /* On mobile the hover underline is a short gold bar under the label */
    .cbb-header .cbb-header__link::after {
      right: auto;
      bottom: 10px;
      width: 28px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cbb-header .cbb-header__bar,
    .cbb-header .cbb-header__link,
    .cbb-header .cbb-header__link::after,
    .cbb-header .cbb-header__bar-line,
    .cbb-header .cbb-header__nav {
      transition: none;
    }
  }
</style>

<div class="cbb-header">
  <header class="cbb-header__bar">
    <div class="cbb-header__inner">
      <a class="cbb-header__brand" href="/" aria-label="Covered Bridge Brands home">
        <!-- LOGO: served from the GHL media library (Covered Bridge Brands logo). -->
        <img class="cbb-header__logo" src="https://assets.cdn.filesafe.space/1LlHASBki3wgNdbhAlBp/media/6abd1ce51b644080e36e3b11.webp" alt="Covered Bridge Brands" width="576" height="120" decoding="async">
      </a>

      <button class="cbb-header__toggle" type="button" aria-expanded="false" aria-controls="cbb-header-nav">
        <span class="cbb-header__bar-line" aria-hidden="true"></span>
        <span class="cbb-header__bar-line" aria-hidden="true"></span>
        <span class="cbb-header__bar-line" aria-hidden="true"></span>
        <span class="cbb-header__sr">Open menu</span>
      </button>

      <nav class="cbb-header__nav" id="cbb-header-nav" aria-label="Main">
        <!-- Links only turn gold and underline on hover. The current page is
             tagged for screen readers (aria-current) from the URL, with no
             visual change. -->
        <ul class="cbb-header__list">
          <li class="cbb-header__item"><a class="cbb-header__link" href="/">Home</a></li>
          <li class="cbb-header__item"><a class="cbb-header__link" href="/services">Services</a></li>
          <li class="cbb-header__item"><a class="cbb-header__link" href="/about">About</a></li>
          <li class="cbb-header__item"><a class="cbb-header__link" href="/contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
</div>

<script>
  (function () {
    var roots = document.querySelectorAll('.cbb-header:not([data-cbb-ready])');
    Array.prototype.forEach.call(roots, function (root) {
      root.setAttribute('data-cbb-ready', '');
      var toggle = root.querySelector('.cbb-header__toggle');
      var label = root.querySelector('.cbb-header__sr');
      var links = root.querySelectorAll('.cbb-header__link');
      var desktop = window.matchMedia('(min-width: 861px)');

      /* Current page: tag the matching link for screen readers */
      var clean = function (p) { return (p || '/').replace(/\/+$/, '') || '/'; };
      var here = clean(window.location.pathname);
      var match = null;
      Array.prototype.forEach.call(links, function (a) {
        var path = clean(a.getAttribute('href'));
        if (path === here || (path !== '/' && here.indexOf(path + '/') === 0)) match = a;
      });
      if (match) match.setAttribute('aria-current', 'page');

      /* Mobile menu */
      var setOpen = function (open) {
        root.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        label.textContent = open ? 'Close menu' : 'Open menu';
      };
      toggle.addEventListener('click', function () {
        setOpen(!root.classList.contains('is-open'));
      });
      Array.prototype.forEach.call(links, function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && root.classList.contains('is-open')) {
          setOpen(false);
          toggle.focus();
        }
      });
      document.addEventListener('click', function (e) {
        if (root.classList.contains('is-open') && !root.contains(e.target)) setOpen(false);
      });
      var onBreakpoint = function () { if (desktop.matches) setOpen(false); };
      if (desktop.addEventListener) desktop.addEventListener('change', onBreakpoint);
      else if (desktop.addListener) desktop.addListener(onBreakpoint);

      /* Shadow once the page scrolls */
      var onScroll = function () { root.classList.toggle('is-scrolled', window.scrollY > 8); };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    });
  })();
</script>
