<!-- ============================================================
     CBB HOME — 00 HEADER / NAVIGATION
     Paste into a GoHighLevel Custom HTML/JavaScript element.
     All styles are scoped to .cbb-header. No JavaScript: the mobile
     menu uses a hidden checkbox toggle.
     ============================================================ -->
<style>
  .cbb-header {
    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;

    position: relative;
    z-index: 50;
    width: 100%;
    margin: 0;
    padding: 0 clamp(20px, 4vw, 48px);
    background: var(--cbb-black);
    border-bottom: 1px solid rgba(213, 167, 86, 0.45);
    font-family: var(--cbb-sans);
  }
  .cbb-header,
  .cbb-header *,
  .cbb-header *::before,
  .cbb-header *::after {
    box-sizing: border-box;
  }

  .cbb-header .cbb-header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    max-width: 1320px;
    min-height: 88px;
    margin: 0 auto;
  }

  /* ---- Logo ---- */
  .cbb-header .cbb-header__brand {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.4vw, 16px);
    min-width: 0;
    color: var(--cbb-gold);
    text-decoration: none;
  }
  .cbb-header .cbb-header__mark {
    display: block;
    flex: 0 0 auto;
    width: clamp(64px, 8vw, 118px);
    height: auto;
    max-width: 100%;
  }
  .cbb-header .cbb-header__logo-img {
    display: block;
    width: auto;
    max-width: 100%;
    height: 60px;
  }
  .cbb-header .cbb-header__word {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .cbb-header .cbb-header__name {
    font-family: var(--cbb-serif);
    font-size: clamp(1.05rem, 1.3vw + 0.5rem, 1.7rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--cbb-gold);
    background: linear-gradient(180deg, var(--cbb-gold-light), var(--cbb-gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cbb-header .cbb-header__sub {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    font-family: var(--cbb-sans);
    font-size: clamp(0.6rem, 0.3vw + 0.5rem, 0.8rem);
    font-weight: 500;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cbb-gold);
  }
  .cbb-header .cbb-header__sub::before,
  .cbb-header .cbb-header__sub::after {
    content: "";
    width: clamp(14px, 2vw, 26px);
    height: 1px;
    background: var(--cbb-gold);
  }
  /* letter-spacing adds space after the last letter; pull the line back in */
  .cbb-header .cbb-header__sub span {
    margin-right: -0.5em;
  }

  /* ---- Nav ---- */
  .cbb-header .cbb-header__toggle {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
  .cbb-header .cbb-header__burger {
    display: none;
  }
  .cbb-header .cbb-header__list {
    display: flex;
    align-items: center;
    gap: clamp(24px, 3.4vw, 48px);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cbb-header .cbb-header__item {
    margin: 0;
    padding: 0;
  }
  .cbb-header .cbb-header__item::marker {
    content: none;
  }
  .cbb-header .cbb-header__link {
    position: relative;
    display: inline-block;
    padding: 8px 0;
    font-family: var(--cbb-sans);
    font-size: 0.9375rem;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-header .cbb-header__link:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-header .cbb-header__link:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 4px;
  }
  .cbb-header .cbb-header__link.is-active {
    color: var(--cbb-gold);
  }
  .cbb-header .cbb-header__link.is-active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -2px;
    height: 2px;
    background: linear-gradient(90deg, var(--cbb-gold-deep), var(--cbb-gold-light));
  }

  /* ---- Mobile menu ---- */
  @media (max-width: 860px) {
    .cbb-header .cbb-header__burger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 44px;
      height: 44px;
      padding: 0 10px;
      border: 1px solid rgba(213, 167, 86, 0.5);
      border-radius: 3px;
      cursor: pointer;
    }
    .cbb-header .cbb-header__burger span {
      display: block;
      height: 1.5px;
      background: var(--cbb-gold);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .cbb-header .cbb-header__toggle:focus-visible + .cbb-header__burger {
      outline: 2px solid var(--cbb-gold-light);
      outline-offset: 3px;
    }
    .cbb-header .cbb-header__toggle:checked + .cbb-header__burger span:nth-child(1) {
      transform: translateY(7.5px) rotate(45deg);
    }
    .cbb-header .cbb-header__toggle:checked + .cbb-header__burger span:nth-child(2) {
      opacity: 0;
    }
    .cbb-header .cbb-header__toggle:checked + .cbb-header__burger span:nth-child(3) {
      transform: translateY(-7.5px) rotate(-45deg);
    }
    .cbb-header .cbb-header__nav {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      display: none;
      padding: 8px clamp(20px, 4vw, 48px) 20px;
      background: var(--cbb-black);
      border-bottom: 1px solid rgba(213, 167, 86, 0.45);
    }
    .cbb-header .cbb-header__toggle:checked ~ .cbb-header__nav {
      display: block;
    }
    .cbb-header .cbb-header__list {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }
    .cbb-header .cbb-header__link {
      display: block;
      padding: 14px 0;
      border-bottom: 1px solid rgba(213, 167, 86, 0.15);
      font-size: 1rem;
    }
    .cbb-header .cbb-header__link.is-active::after {
      display: none;
    }
  }
  @media (max-width: 400px) {
    .cbb-header .cbb-header__sub {
      letter-spacing: 0.38em;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cbb-header .cbb-header__link,
    .cbb-header .cbb-header__burger span {
      transition: none;
    }
  }
</style>

<header class="cbb-header">
  <div class="cbb-header__inner">
    <a class="cbb-header__brand" href="/" aria-label="Covered Bridge Brands home">
      <!-- LOGO: this SVG + text is a stand-in for the Covered Bridge Brands logo.
           To use the real logo file instead, delete the <svg> and the
           .cbb-header__word <span> below and uncomment this <img>: -->
      <!-- <img class="cbb-header__logo-img" src="PASTE-LOGO-URL-HERE" alt="Covered Bridge Brands"> -->
      <svg class="cbb-header__mark" viewBox="0 0 120 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="cbb-hdr-gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F3CF7C"/>
            <stop offset="1" stop-color="#C9994A"/>
          </linearGradient>
        </defs>
        <g stroke="url(#cbb-hdr-gold)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M22 28 60 6l38 22"/>
          <path d="M28 25v29M92 25v29"/>
          <path d="M46 54V41a14 14 0 0 1 28 0v13"/>
          <path d="M34 22v32M40 18v36M80 18v36M86 22v32M52 13v14M60 9v18M68 13v14"/>
          <path d="M2 56h116"/>
          <path d="M28 50H10M110 50H92"/>
        </g>
        <g fill="url(#cbb-hdr-gold)">
          <path d="M6 56 12 42l6 14z"/>
          <path d="M13 56l5-11 5 11z"/>
          <path d="M114 56l-6-14-6 14z"/>
          <path d="M107 56l-5-11-5 11z"/>
        </g>
      </svg>
      <span class="cbb-header__word">
        <span class="cbb-header__name">Covered Bridge</span>
        <span class="cbb-header__sub"><span>Brands</span></span>
      </span>
    </a>

    <input class="cbb-header__toggle" type="checkbox" id="cbb-header-toggle" aria-label="Open menu">
    <label class="cbb-header__burger" for="cbb-header-toggle" aria-hidden="true">
      <span></span><span></span><span></span>
    </label>

    <nav class="cbb-header__nav" aria-label="Main">
      <!-- LINKS: point these at your GHL page paths. Move class="is-active"
           to the current page's link when reusing this header elsewhere. -->
      <ul class="cbb-header__list">
        <li class="cbb-header__item"><a class="cbb-header__link is-active" href="/" aria-current="page">Home</a></li>
        <li class="cbb-header__item"><a class="cbb-header__link" href="#our-systems">Services</a></li>
        <li class="cbb-header__item"><a class="cbb-header__link" href="/about">About</a></li>
        <li class="cbb-header__item"><a class="cbb-header__link" href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
