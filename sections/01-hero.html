    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;

    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    background: var(--cbb-black);
    color: var(--cbb-cream);
    font-family: var(--cbb-sans);
    overflow: hidden;
    isolation: isolate;
  }
  .cbb-hero,
  .cbb-hero *,
  .cbb-hero *::before,
  .cbb-hero *::after {
    box-sizing: border-box;
  }

  /* ---- Photo (right side, fades into black on the left) ---- */
  .cbb-hero .cbb-hero__photo {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
    width: 100%;
    background-color: #1A140C;
    background-image:
      var(--cbb-hero-photo),
      radial-gradient(45% 45% at 62% 28%, rgba(255, 214, 140, 0.55), rgba(255, 214, 140, 0) 70%),
      radial-gradient(40% 55% at 62% 62%, rgba(150, 92, 38, 0.55), rgba(150, 92, 38, 0) 70%),
      radial-gradient(35% 60% at 95% 40%, rgba(90, 70, 30, 0.6), rgba(90, 70, 30, 0) 70%),
      linear-gradient(180deg, #3B2A16 0%, #22190F 55%, #120E09 100%);
    background-size: cover;
    background-position: right center;
    background-repeat: no-repeat;
  }
  .cbb-hero .cbb-hero__photo::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(10, 11, 12, 0.85) 0%, rgba(10, 11, 12, 0.55) 30%, rgba(10, 11, 12, 0) 55%),
      linear-gradient(0deg, rgba(10, 11, 12, 0.65) 0%, rgba(10, 11, 12, 0) 30%);
  }

  .cbb-hero .cbb-hero__inner {
    display: flex;
    align-items: center;
    max-width: 1320px;
    min-height: clamp(520px, 44vw, 680px);
    margin: 0 auto;
    padding: clamp(64px, 8vw, 110px) clamp(20px, 4vw, 48px);
  }
  .cbb-hero .cbb-hero__content {
    max-width: 640px;
  }

  .cbb-hero .cbb-hero__title {
    margin: 0 0 clamp(20px, 2.4vw, 30px);
    padding: 0;
    font-family: var(--cbb-serif);
    font-size: clamp(2.4rem, 4.2vw + 0.6rem, 5rem);
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--cbb-cream);
  }
  .cbb-hero .cbb-hero__line {
    display: block;
  }
  .cbb-hero .cbb-hero__line--gold {
    color: var(--cbb-gold);
    background: linear-gradient(180deg, var(--cbb-gold-light) 0%, var(--cbb-gold) 55%, var(--cbb-gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cbb-hero .cbb-hero__line--light {
    color: var(--cbb-cream);
  }

  .cbb-hero .cbb-hero__sub {
    max-width: 30em;
    margin: 0 0 clamp(30px, 3.4vw, 40px);
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: clamp(1rem, 0.35vw + 0.92rem, 1.15rem);
    font-weight: 400;
    line-height: 1.6;
    color: var(--cbb-cream);
  }

  .cbb-hero .cbb-hero__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .cbb-hero .cbb-hero__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 52px;
    padding: 0 26px;
    border: 1px solid transparent;
    border-radius: 3px;
    font-family: var(--cbb-sans);
    font-size: 0.975rem;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: none;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  }
  .cbb-hero .cbb-hero__btn svg {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    transition: transform 0.2s ease;
  }
  .cbb-hero .cbb-hero__btn:hover svg {
    transform: translateX(3px);
  }
  .cbb-hero .cbb-hero__btn--gold {
    background: linear-gradient(135deg, var(--cbb-gold-deep), var(--cbb-gold-light));
    color: var(--cbb-black);
  }
  .cbb-hero .cbb-hero__btn--gold:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(213, 167, 86, 0.3);
    color: var(--cbb-black);
  }
  .cbb-hero .cbb-hero__btn--outline {
    background: rgba(10, 11, 12, 0.35);
    border-color: var(--cbb-gold);
    color: var(--cbb-gold-light);
  }
  .cbb-hero .cbb-hero__btn--outline:hover {
    background: rgba(213, 167, 86, 0.1);
    color: var(--cbb-gold-light);
  }
  .cbb-hero .cbb-hero__btn:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }

  /* ---- Caption ---- */
  .cbb-hero .cbb-hero__caption {
    position: absolute;
    right: clamp(20px, 4vw, 48px);
    bottom: clamp(24px, 3vw, 40px);
    margin: 0;
    font-family: var(--cbb-sans);
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.9;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    text-align: right;
    color: var(--cbb-cream);
  }
  .cbb-hero .cbb-hero__caption::after {
    content: "";
    display: block;
    width: 52px;
    height: 2px;
    margin: 12px auto 0;
    background: linear-gradient(90deg, var(--cbb-gold-deep), var(--cbb-gold-light));
  }

  /* ---- Stacked layout: text on top, photo below ---- */
  @media (max-width: 860px) {
    .cbb-hero {
      display: flex;
      flex-direction: column;
    }
    .cbb-hero .cbb-hero__inner {
      min-height: 0;
      width: 100%;
      padding-bottom: 40px;
    }
    .cbb-hero .cbb-hero__photo {
      position: relative;
      order: 2;
      width: 100%;
      height: clamp(280px, 70vw, 440px);
      background-position: 82% center;
    }
    .cbb-hero .cbb-hero__photo::before {
      background:
        linear-gradient(180deg, #0A0B0C 0%, rgba(10, 11, 12, 0) 35%),
        linear-gradient(0deg, rgba(10, 11, 12, 0.7) 0%, rgba(10, 11, 12, 0) 35%);
    }
  }
  @media (max-width: 480px) {
    .cbb-hero .cbb-hero__actions {
      flex-direction: column;
    }
    .cbb-hero .cbb-hero__btn {
      width: 100%;
    }
    .cbb-hero .cbb-hero__caption {
      font-size: 0.6875rem;
      letter-spacing: 0.22em;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cbb-hero .cbb-hero__btn,
    .cbb-hero .cbb-hero__btn svg {
      transition: none;
    }
  }
</style>
