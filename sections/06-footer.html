<!-- ============================================================
     CBB HOME — 06 FOOTER
     Paste into a GoHighLevel Custom HTML/JavaScript element.
     All styles are scoped to .cbb-footer.
     ============================================================ -->
<style>
  .cbb-footer {
    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;

    position: relative;
    width: 100%;
    margin: 0;
    padding: clamp(36px, 4vw, 48px) clamp(20px, 4vw, 48px) 24px;
    background: var(--cbb-black);
    border-top: 1px solid rgba(213, 167, 86, 0.45);
    color: var(--cbb-cream);
    font-family: var(--cbb-sans);
  }
  .cbb-footer,
  .cbb-footer *,
  .cbb-footer *::before,
  .cbb-footer *::after {
    box-sizing: border-box;
  }

  .cbb-footer .cbb-footer__inner {
    max-width: 1320px;
    margin: 0 auto;
  }
  .cbb-footer .cbb-footer__top {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(24px, 4vw, 56px);
    padding-bottom: clamp(24px, 3vw, 32px);
    border-bottom: 1px solid rgba(213, 167, 86, 0.3);
  }

  /* ---- Logo ---- */
  .cbb-footer .cbb-footer__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--cbb-gold);
    text-decoration: none;
  }
  .cbb-footer .cbb-footer__mark {
    display: block;
    flex: 0 0 auto;
    width: clamp(72px, 7vw, 110px);
    height: auto;
    max-width: 100%;
  }
  .cbb-footer .cbb-footer__logo-img {
    display: block;
    width: auto;
    max-width: 100%;
    height: 56px;
  }
  .cbb-footer .cbb-footer__word {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .cbb-footer .cbb-footer__name {
    font-family: var(--cbb-serif);
    font-size: clamp(1.05rem, 0.8vw + 0.7rem, 1.5rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--cbb-gold);
    background: linear-gradient(180deg, var(--cbb-gold-light), var(--cbb-gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cbb-footer .cbb-footer__sub {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cbb-gold);
  }
  .cbb-footer .cbb-footer__sub::before,
  .cbb-footer .cbb-footer__sub::after {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--cbb-gold);
  }
  .cbb-footer .cbb-footer__sub span {
    margin-right: -0.5em;
  }

  /* ---- Company info ---- */
  .cbb-footer .cbb-footer__company {
    margin: 0 0 8px;
    padding: 0;
    font-size: 0.875rem;
    font-weight: 400;
    line-height: 1.4;
    color: var(--cbb-cream);
  }
  .cbb-footer .cbb-footer__tagline {
    margin: 0;
    padding: 0;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--cbb-cream);
  }

  /* ---- Legal links + social ---- */
  .cbb-footer .cbb-footer__side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
  }
  .cbb-footer .cbb-footer__legal {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    padding: 0;
    font-size: 0.8125rem;
    color: rgba(246, 239, 227, 0.5);
  }
  .cbb-footer .cbb-footer__link {
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-footer .cbb-footer__link:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-footer .cbb-footer__social {
    display: flex;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .cbb-footer .cbb-footer__social li {
    margin: 0;
    padding: 0;
  }
  .cbb-footer .cbb-footer__social li::marker {
    content: none;
  }
  .cbb-footer .cbb-footer__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-footer .cbb-footer__icon:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-footer .cbb-footer__icon svg {
    width: 22px;
    height: 22px;
  }
  .cbb-footer .cbb-footer__link:focus-visible,
  .cbb-footer .cbb-footer__icon:focus-visible,
  .cbb-footer .cbb-footer__brand:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }

  .cbb-footer .cbb-footer__copy {
    margin: 0;
    padding: 20px 0 0;
    font-size: 0.8125rem;
    line-height: 1.5;
    text-align: center;
    color: rgba(246, 239, 227, 0.6);
  }

  @media (max-width: 860px) {
    .cbb-footer .cbb-footer__top {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      text-align: center;
    }
    .cbb-footer .cbb-footer__side {
      align-items: center;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cbb-footer .cbb-footer__link,
    .cbb-footer .cbb-footer__icon {
      transition: none;
    }
  }
</style>
