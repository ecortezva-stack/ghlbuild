     CBB — FOOTER
     Paste into a GoHighLevel Custom HTML/JavaScript element.
     All styles are scoped to .cbb-footer. No JavaScript.
     ============================================================ -->
<style>
  .cbb-footer {
    --cbb-gold: #D5A756;
    --cbb-gold-light: #F3CF7C;
    --cbb-gold-deep: #C9994A;
    --cbb-black: #0A0B0C;
    --cbb-surface: #121415;
    --cbb-white: #FFFFFF;
    --cbb-cream: #F6EFE3;
    --cbb-muted: #B9BEC4;
    --cbb-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --cbb-sans: 'Inter', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;

    position: relative;
    display: block;
    width: 100%;
    margin: 0;
    padding: clamp(40px, 4.4vw, 56px) clamp(16px, 4vw, 48px) 28px;
    background: var(--cbb-black);
    border-top: 1px solid rgba(213, 167, 86, 0.45);
    color: var(--cbb-cream);
    font-family: var(--cbb-sans);
  }
  .cbb-footer,
  .cbb-footer *,
  .cbb-footer *::before,
  .cbb-footer *::after {
    box-sizing: border-box;
  }

  .cbb-footer .cbb-footer__inner {
    max-width: 1320px;
    margin: 0 auto;
  }
  .cbb-footer .cbb-footer__top {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(24px, 4vw, 56px);
    padding-bottom: clamp(28px, 3vw, 36px);
  }

  /* ---- Logo ---- */
  .cbb-footer .cbb-footer__brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .cbb-footer .cbb-footer__logo {
    display: block;
    width: auto;
    max-width: 100%;
    height: clamp(46px, 3.8vw, 56px);
    border: 0;
  }

  /* ---- Company + tagline ---- */
  .cbb-footer .cbb-footer__company {
    margin: 0 0 8px;
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: 0.9375rem;
    font-weight: 400;
    line-height: 1.4;
    color: var(--cbb-cream);
  }
  .cbb-footer .cbb-footer__tagline {
    margin: 0;
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--cbb-gold);
  }

  /* ---- Legal links + social ---- */
  .cbb-footer .cbb-footer__side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
  }
  .cbb-footer .cbb-footer__legal {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    margin: 0;
    padding: 0;
    font-family: var(--cbb-sans);
    font-size: 0.8125rem;
    line-height: 1.4;
    color: rgba(213, 167, 86, 0.6);
  }
  .cbb-footer .cbb-footer__link {
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .cbb-footer .cbb-footer__link:hover {
    color: var(--cbb-gold-light);
  }
  .cbb-footer .cbb-footer__social {
    display: flex;
    gap: 6px;
    margin: 0 -8px 0 0;
    padding: 0;
    list-style: none;
  }
  .cbb-footer .cbb-footer__social-item {
    margin: 0;
    padding: 0;
  }
  .cbb-footer .cbb-footer__social-item::marker {
    content: none;
  }
  .cbb-footer .cbb-footer__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    color: var(--cbb-cream);
    text-decoration: none;
    transition: color 0.2s ease, background-color 0.2s ease;
  }
  .cbb-footer .cbb-footer__icon:hover {
    color: var(--cbb-gold-light);
    background: rgba(213, 167, 86, 0.08);
  }
  .cbb-footer .cbb-footer__icon svg {
    display: block;
    width: 22px;
    height: 22px;
  }
  .cbb-footer .cbb-footer__brand:focus-visible,
  .cbb-footer .cbb-footer__link:focus-visible,
  .cbb-footer .cbb-footer__icon:focus-visible {
    outline: 2px solid var(--cbb-gold-light);
    outline-offset: 3px;
  }

  /* ---- Divider + copyright ---- */
  .cbb-footer .cbb-footer__divider {
    display: block;
    width: 100%;
    height: 1px;
    margin: 0;
    border: 0;
    background: linear-gradient(90deg, rgba(213, 167, 86, 0), rgba(213, 167, 86, 0.7) 15%, rgba(213, 167, 86, 0.7) 85%, rgba(213, 167, 86, 0));
  }
  .cbb-footer .cbb-footer__copy {
    margin: 0;
    padding: 22px 0 0;
    font-family: var(--cbb-sans);
    font-size: 0.8125rem;
    line-height: 1.5;
    text-align: center;
    color: rgba(246, 239, 227, 0.6);
  }

  /* ---- Mobile: stack everything, centered ---- */
  @media (max-width: 860px) {
    .cbb-footer .cbb-footer__top {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      gap: 22px;
      text-align: center;
    }
    .cbb-footer .cbb-footer__side {
      align-items: center;
    }
    .cbb-footer .cbb-footer__legal {
      justify-content: center;
    }
    .cbb-footer .cbb-footer__social {
      margin: 0;
    }
  }
  @media (max-width: 400px) {
    .cbb-footer .cbb-footer__tagline {
      letter-spacing: 0.22em;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cbb-footer .cbb-footer__link,
    .cbb-footer .cbb-footer__icon {
      transition: none;
    }
  }
</style>
